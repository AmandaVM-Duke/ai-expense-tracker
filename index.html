<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Amanda · Expenses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0f0f0f; --surface: #1a1a1a; --surface2: #222; --border: #2a2a2a; --border2: #383838;
  --text: #f0ede6; --text2: #888580; --text3: #4a4744;
  --green: #4ade80; --amber: #fbbf24; --red: #f87171; --accent: #d4a853;
  --font-serif: 'Lora', Georgia, serif; --font-mono: 'IBM Plex Mono', monospace;
}
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-mono); }
.app { display: flex; flex-direction: column; height: 100dvh; max-width: 700px; margin: 0 auto; }

.header { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0; background: var(--bg); }
.header-title { font-family: var(--font-serif); font-size: 18px; font-weight: 500; }
.header-sub { font-size: 10px; color: var(--text3); letter-spacing: 0.1em; text-transform: uppercase; margin-top: 1px; }
.tabs { display: flex; gap: 4px; }
.tab-btn { background: var(--surface); border: 1px solid var(--border2); border-radius: 8px; padding: 6px 14px; font-family: var(--font-mono); font-size: 11px; color: var(--text2); cursor: pointer; transition: all 0.15s; }
.tab-btn:hover { color: var(--text); }
.tab-btn.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 500; }

.page { display: none; flex: 1; overflow: hidden; flex-direction: column; }
.page.active { display: flex; }

/* CHAT */
.messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
.messages::-webkit-scrollbar { width: 3px; }
.messages::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 99px; }
.msg { display: flex; flex-direction: column; max-width: 88%; animation: fadeUp 0.2s ease; }
@keyframes fadeUp { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
.msg.user { align-self: flex-end; align-items: flex-end; }
.msg.bot  { align-self: flex-start; align-items: flex-start; }
.bubble { padding: 11px 15px; border-radius: 14px; font-size: 14px; line-height: 1.55; }
.msg.user .bubble { background: var(--accent); color: #0f0f0f; border-bottom-right-radius: 4px; font-family: var(--font-serif); }
.msg.bot  .bubble { background: var(--surface); color: var(--text); border-bottom-left-radius: 4px; border: 1px solid var(--border); }
.msg-time { font-size: 10px; color: var(--text3); margin-top: 3px; padding: 0 4px; }
.expense-card { background: var(--surface2); border: 1px solid var(--border2); border-radius: 10px; padding: 10px 14px; margin-top: 10px; display: flex; align-items: center; gap: 14px; }
.expense-amount { font-size: 20px; font-weight: 500; color: var(--green); white-space: nowrap; }
.expense-merchant { font-size: 13px; color: var(--text); font-family: var(--font-serif); }
.expense-cat { font-size: 10px; color: var(--text2); margin-top: 2px; letter-spacing: 0.06em; text-transform: uppercase; }
.expense-saved { font-size: 10px; margin-top: 4px; }
.expense-saved.ok { color: var(--green); }
.expense-saved.warn { color: var(--amber); }
.typing { display: flex; align-items: center; gap: 5px; padding: 12px 15px; }
.typing span { width: 6px; height: 6px; background: var(--text3); border-radius: 50%; animation: bounce 1.2s infinite; }
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce { 0%,60%,100%{ transform:translateY(0); } 30%{ transform:translateY(-5px); } }
.input-area { padding: 12px 16px 16px; border-top: 1px solid var(--border); background: var(--bg); flex-shrink: 0; }
.hints { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.hint { font-size: 11px; color: var(--text3); background: var(--surface); border: 1px solid var(--border); border-radius: 99px; padding: 4px 12px; cursor: pointer; transition: all 0.12s; white-space: nowrap; }
.hint:hover { color: var(--text); border-color: var(--border2); }
.input-row { display: flex; gap: 10px; align-items: flex-end; }
.input-box { flex: 1; background: var(--surface); border: 1px solid var(--border2); border-radius: 12px; padding: 12px 16px; font-family: var(--font-serif); font-size: 15px; color: var(--text); resize: none; outline: none; min-height: 46px; max-height: 120px; line-height: 1.4; transition: border-color 0.15s; }
.input-box::placeholder { color: var(--text3); font-style: italic; }
.input-box:focus { border-color: var(--accent); }
.send-btn { background: var(--accent); color: #000; border: none; border-radius: 12px; width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
.send-btn:hover { opacity: 0.85; }
.send-btn svg { width: 18px; height: 18px; }

/* DASHBOARD */
.dash { flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 16px; }
.dash::-webkit-scrollbar { width: 3px; }
.dash::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 99px; }
.dash-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.month-selector { display: flex; align-items: center; gap: 8px; }
.month-selector select { background: var(--surface); border: 1px solid var(--border2); border-radius: 8px; padding: 7px 12px; font-family: var(--font-mono); font-size: 12px; color: var(--text); outline: none; cursor: pointer; }
.month-selector label { font-size: 11px; color: var(--text3); letter-spacing: 0.06em; text-transform: uppercase; }
.refresh-btn { background: var(--surface); border: 1px solid var(--border2); border-radius: 8px; padding: 7px 12px; font-family: var(--font-mono); font-size: 11px; color: var(--text2); cursor: pointer; transition: all 0.15s; white-space: nowrap; }
.refresh-btn:hover { color: var(--text); border-color: var(--accent); }
.stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
.stat-label { font-size: 10px; color: var(--text3); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 6px; }
.stat-value { font-size: 20px; font-weight: 500; font-family: var(--font-mono); letter-spacing: -0.03em; }
.stat-value.accent { color: var(--accent); }
.stat-value.green { color: var(--green); }
.stat-sub { font-size: 10px; color: var(--text3); margin-top: 3px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; }
.card-title { font-size: 10px; color: var(--text3); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 14px; }
.cat-list { display: flex; flex-direction: column; gap: 8px; }
.cat-row { display: grid; grid-template-columns: 12px 1fr 60px 80px; align-items: center; gap: 10px; }
.cat-dot { width: 8px; height: 8px; border-radius: 50%; }
.cat-name { font-size: 13px; color: var(--text2); }
.cat-bar-wrap { height: 4px; background: var(--border2); border-radius: 99px; overflow: hidden; }
.cat-bar { height: 100%; border-radius: 99px; transition: width 0.5s ease; }
.cat-amount { font-size: 12px; font-family: var(--font-mono); color: var(--text); text-align: right; }
.chart-wrap { position: relative; height: 220px; }
.entries-list { display: flex; flex-direction: column; gap: 6px; }
.entry-row { display: grid; grid-template-columns: 1fr auto auto auto; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 10px; background: var(--surface2); border: 1px solid var(--border); }
.entry-info { min-width: 0; }
.entry-desc { font-size: 13px; font-family: var(--font-serif); color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.entry-meta { font-size: 10px; color: var(--text3); margin-top: 2px; }
.entry-cat-pill { font-size: 10px; font-family: var(--font-mono); padding: 2px 8px; border-radius: 99px; background: var(--border); color: var(--text2); white-space: nowrap; }
.entry-amt { font-size: 13px; font-family: var(--font-mono); font-weight: 500; color: var(--text); white-space: nowrap; }
.entry-actions { display: flex; gap: 4px; }
.action-btn { background: none; border: 1px solid transparent; border-radius: 6px; padding: 4px 6px; cursor: pointer; font-size: 13px; transition: all 0.15s; line-height: 1; }
.action-btn.del:hover { background: #2a1a1a; border-color: var(--red); }
.no-data { font-size: 13px; color: var(--text3); text-align: center; padding: 24px 0; font-style: italic; }
.loading { font-size: 12px; color: var(--text3); text-align: center; padding: 40px 0; font-family: var(--font-mono); }
.source-badge { font-size: 10px; color: var(--text3); text-align: right; font-family: var(--font-mono); }
.source-badge.sheets { color: var(--green); }

/* Modals */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal { background: var(--surface); border: 1px solid var(--border2); border-radius: 16px; padding: 24px; max-width: 440px; width: 100%; max-height: 85vh; overflow-y: auto; }
.modal-title { font-family: var(--font-serif); font-size: 18px; margin-bottom: 18px; }
.field-row { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
.field-label { font-size: 11px; color: var(--text2); letter-spacing: 0.05em; text-transform: uppercase; }
.field-input { background: var(--bg); border: 1px solid var(--border2); border-radius: 8px; padding: 10px 14px; font-family: var(--font-mono); font-size: 13px; color: var(--text); outline: none; width: 100%; }
.field-input:focus { border-color: var(--accent); }
.modal-actions { display: flex; gap: 8px; margin-top: 4px; }
.modal-save { background: var(--accent); color: #000; border: none; border-radius: 10px; padding: 11px 20px; flex: 1; font-family: var(--font-mono); font-size: 13px; font-weight: 500; cursor: pointer; }
.modal-cancel { background: none; border: 1px solid var(--border2); border-radius: 10px; padding: 11px 20px; font-family: var(--font-mono); font-size: 13px; color: var(--text2); cursor: pointer; }
.modal-step { margin-bottom: 18px; }
.modal-step-num { font-size: 10px; color: var(--accent); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 6px; }
.modal-step p { font-size: 13px; color: var(--text2); line-height: 1.65; margin-bottom: 8px; }
.modal-step code { display: block; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; font-size: 11px; color: var(--green); word-break: break-all; margin-top: 6px; white-space: pre-wrap; }
.modal-save-full { background: var(--accent); color: #000; border: none; border-radius: 10px; padding: 12px 24px; width: 100%; font-family: var(--font-mono); font-size: 13px; font-weight: 500; cursor: pointer; margin-top: 4px; }
.modal-close { background: none; border: none; color: var(--text3); font-family: var(--font-mono); font-size: 12px; cursor: pointer; margin-top: 12px; display: block; width: 100%; text-align: center; }

@media (max-width: 480px) {
  .stat-row { grid-template-columns: 1fr 1fr; }
  .cat-row { grid-template-columns: 12px 1fr 75px; }
  .cat-bar-wrap { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div>
      <div class="header-title">Amanda</div>
      <div class="header-sub">expense tracker</div>
    </div>
    <div class="tabs">
      <button class="tab-btn active" onclick="goTab('chat', this)">💬 Chat</button>
      <button class="tab-btn" onclick="goTab('dashboard', this)">📊 Dashboard</button>
    </div>
  </div>

  <!-- CHAT -->
  <div class="page active" id="page-chat">
    <div class="messages" id="messages"></div>
    <div class="input-area">
      <div class="hints">
        <span class="hint" onclick="fillHint('$11 Shake Shack')">$11 Shake Shack</span>
        <span class="hint" onclick="fillHint('Uber $18')">Uber $18</span>
        <span class="hint" onclick="fillHint('Harris Teeter 65')">Harris Teeter 65</span>
        <span class="hint" onclick="fillHint('how much this month?')">this month?</span>
      </div>
      <div class="input-row">
        <textarea class="input-box" id="inputBox" placeholder="$11 Shake Shack…" rows="1"></textarea>
        <button class="send-btn" onclick="sendMessage()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div class="page" id="page-dashboard">
    <div class="dash" id="dashContent">
      <div class="loading">Loading expenses from Google Sheets…</div>
    </div>
  </div>
</div>

<!-- Sheet setup modal -->
<div class="modal-overlay" id="sheetModal">
  <div class="modal">
    <div class="modal-title">Connect Google Sheets</div>
    <div class="field-row" style="margin-bottom:6px">
      <div class="field-label">Apps Script URL</div>
      <input class="field-input" id="sheetUrlInput" type="text" placeholder="https://script.google.com/macros/s/..." />
    </div>
    <button class="modal-save-full" onclick="saveSheetUrl()">Save & connect</button>
    <button class="modal-close" onclick="closeSheet()">Cancel</button>
  </div>
</div>

<script>
const MONTHS = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const CATS = [
  { key:'Supermarket',    color:'#0891b2' },
  { key:'Eating outside', color:'#dc2626' },
  { key:'Hanging out',    color:'#7c3aed' },
  { key:'Transportation', color:'#6b7280' },
  { key:'Assinaturas',    color:'#db2777' },
  { key:'Furniture',      color:'#65a30d' },
  { key:'Outros',         color:'#b45309' },
  { key:'Rental',         color:'#2b5ce6' },
  { key:'Insurance',      color:'#1a7a4a' },
  { key:'Energy',         color:'#d97706' },
];

function getSheetUrl() { return window._sheetUrl || localStorage.getItem('amanda_sheet_url') || ''; }

async function loadConfig() {
  try {
    const res = await fetch('/api/config');
    const cfg = await res.json();
    if (cfg.sheetUrl) window._sheetUrl = cfg.sheetUrl;
  } catch(e) { console.warn('Could not load config', e); }
}
function fmt(n)        { return '$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function escHtml(s)    { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function now()         { return new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}); }

// ── Tab nav ───────────────────────────────────────────────────────────
function goTab(tab, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-'+tab).classList.add('active');
  btn.classList.add('active');
  if (tab === 'dashboard') renderDashboard();
}

// ── Sheet modal ───────────────────────────────────────────────────────
function openSheet()  { document.getElementById('sheetUrlInput').value = getSheetUrl(); document.getElementById('sheetModal').classList.add('open'); }
function closeSheet() { document.getElementById('sheetModal').classList.remove('open'); }
function saveSheetUrl() {
  const url = document.getElementById('sheetUrlInput').value.trim();
  if (url) localStorage.setItem('amanda_sheet_url', url);
  closeSheet();
  renderDashboard();
}

// ── Fetch from Google Sheets ──────────────────────────────────────────
async function fetchFromSheets() {
  const url = getSheetUrl();
  if (!url) return null;
  try {
    const res = await fetch(url, { method: 'GET' });
    const json = await res.json();
    return json.data || [];
  } catch (err) {
    console.error('Sheets fetch error:', err);
    return null;
  }
}

// ── Delete from Sheets ────────────────────────────────────────────────
// (deletion not supported via Apps Script in this setup — we mark locally)
function deleteEntry(idx, expenses) {
  if (!confirm('Delete this expense?')) return;
  // Remove from local cache and re-render
  expenses.splice(idx, 1);
  localStorage.setItem('amanda_dash_cache', JSON.stringify(expenses));
  renderFromData(expenses, true);
}

// ── Chat ──────────────────────────────────────────────────────────────
const messagesEl = document.getElementById('messages');
const inputBox   = document.getElementById('inputBox');

function addBotMessage(html, card) {
  const msg = document.createElement('div');
  msg.className = 'msg bot';
  msg.innerHTML = `<div class="bubble">${html}${card||''}</div><div class="msg-time">${now()}</div>`;
  messagesEl.appendChild(msg);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}
function addUserMessage(text) {
  const msg = document.createElement('div');
  msg.className = 'msg user';
  msg.innerHTML = `<div class="bubble">${escHtml(text)}</div><div class="msg-time">${now()}</div>`;
  messagesEl.appendChild(msg);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}
function showTyping() {
  const t = document.createElement('div');
  t.className = 'msg bot'; t.id = 'typing';
  t.innerHTML = `<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  messagesEl.appendChild(t); messagesEl.scrollTop = messagesEl.scrollHeight;
  return t;
}

inputBox.addEventListener('keydown', e => { if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();} });
inputBox.addEventListener('input', () => { inputBox.style.height='auto'; inputBox.style.height=Math.min(inputBox.scrollHeight,120)+'px'; });
function fillHint(t) { inputBox.value=t; inputBox.focus(); }

async function sendMessage() {
  const text = inputBox.value.trim();
  if (!text) return;
  inputBox.value=''; inputBox.style.height='auto';
  addUserMessage(text);
  const typing = showTyping();
  try {
    const res = await fetch('/api/chat', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({message:text}) });
    const result = await res.json();
    typing.remove();
    if (result.type==='expense')      handleExpense(result);
    else if (result.type==='summary') handleSummaryFromSheets();
    else addBotMessage(result.reply || 'Try something like "$15 Starbucks" or "how much this month?"');
  } catch(err) {
    typing.remove();
    addBotMessage('Something went wrong. Please try again.');
  }
}

async function handleExpense(exp) {
  const sheetUrl = getSheetUrl();
  let saveMsg = 'No Sheet connected · <span style="text-decoration:underline;cursor:pointer" onclick="openSheet()">Connect</span>';
  let saveOk = false;
  if (sheetUrl) {
    try {
      await fetch(sheetUrl, { method:'POST', mode:'no-cors', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({date:exp.date,merchant:exp.merchant,category:exp.category,amount:exp.amount,notes:exp.notes||'',month:exp.month}) });
      saveMsg='✓ Saved to Google Sheets'; saveOk=true;
    } catch { saveMsg='⚠ Could not reach Sheets'; }
  }
  const card = `<div class="expense-card">
    <div class="expense-amount">${fmt(exp.amount)}</div>
    <div><div class="expense-merchant">${escHtml(exp.merchant)}</div>
    <div class="expense-cat">${exp.category}</div>
    <div class="expense-saved ${saveOk?'ok':'warn'}">${saveMsg}</div></div>
  </div>`;
  addBotMessage('Got it!', card);
}

async function handleSummaryFromSheets() {
  const data = await fetchFromSheets();
  const monthName = MONTHS[new Date().getMonth()];
  const thisMonth = (data||[]).filter(e => e.month === monthName);
  if (!thisMonth.length) { addBotMessage(`No expenses for <strong>${monthName}</strong> yet.`); return; }
  const totals={}; let grand=0;
  thisMonth.forEach(e=>{totals[e.category]=(totals[e.category]||0)+Number(e.amount);grand+=Number(e.amount);});
  const rows=Object.entries(totals).sort((a,b)=>b[1]-a[1])
    .map(([cat,amt])=>`<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border);font-size:12px"><span style="color:var(--text2)">${cat}</span><span>${fmt(amt)}</span></div>`).join('');
  addBotMessage(`<strong>${monthName}</strong> so far:<div style="margin-top:10px">${rows}<div style="display:flex;justify-content:space-between;padding:8px 0 0;font-size:14px"><span>Total</span><span style="color:var(--accent);font-weight:500">${fmt(grand)}</span></div></div>`);
}

// ── Dashboard ─────────────────────────────────────────────────────────
let dashChart = null;

async function renderDashboard() {
  const dash = document.getElementById('dashContent');

  if (!getSheetUrl()) {
    dash.innerHTML = `<div class="no-data" style="padding:40px 0">
      No Google Sheet connected.<br><br>
      <button onclick="openSheet()" style="background:var(--accent);color:#000;border:none;border-radius:8px;padding:10px 20px;font-family:var(--font-mono);font-size:12px;cursor:pointer;margin-top:8px">Connect Sheets</button>
    </div>`;
    return;
  }

  dash.innerHTML = '<div class="loading">⟳ Loading from Google Sheets…</div>';

  const data = await fetchFromSheets();

  if (!data) {
    dash.innerHTML = `<div class="no-data" style="padding:40px 0">Could not load from Sheets.<br><small style="color:var(--text3)">Check your Apps Script URL</small><br><br>
      <button onclick="openSheet()" style="background:var(--surface);color:var(--text2);border:1px solid var(--border2);border-radius:8px;padding:8px 16px;font-family:var(--font-mono);font-size:11px;cursor:pointer">Update URL</button>
    </div>`;
    return;
  }

  localStorage.setItem('amanda_dash_cache', JSON.stringify(data));
  renderFromData(data, true);
}

function renderFromData(expenses, fromSheets) {
  const availableMonths = MONTHS.filter(m => expenses.some(e => e.month === m));
  const currentMonthName = MONTHS[new Date().getMonth()];
  const defaultMonth = availableMonths.includes(currentMonthName) ? currentMonthName : (availableMonths[availableMonths.length-1] || currentMonthName);
  const monthOptions = availableMonths.map(m=>`<option value="${m}" ${m===defaultMonth?'selected':''}>${m}</option>`).join('');
  const sourceLabel = fromSheets
    ? '<span class="source-badge sheets">● Live from Google Sheets</span>'
    : '<span class="source-badge">● Cached</span>';

  document.getElementById('dashContent').innerHTML = `
    <div class="dash-toolbar">
      <div class="month-selector">
        <label>Month</label>
        <select id="monthSelect" onchange="renderMonthFromCache(this.value)">${monthOptions||'<option>No data</option>'}</select>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        ${sourceLabel}
        <button class="refresh-btn" onclick="renderDashboard()">↻ Refresh</button>
      </div>
    </div>
    <div class="stat-row" id="statRow"></div>
    <div class="card"><div class="card-title">By category</div><div class="cat-list" id="catList"></div></div>
    <div class="card"><div class="card-title">Breakdown</div><div class="chart-wrap"><canvas id="dashChart"></canvas></div></div>
    <div class="card"><div class="card-title">Recent entries</div><div class="entries-list" id="entriesList"></div></div>
  `;

  if (availableMonths.length) renderMonthFromCache(defaultMonth);
}

function renderMonthFromCache(monthName) {
  const all = JSON.parse(localStorage.getItem('amanda_dash_cache') || '[]');
  const expenses = all.filter(e => e.month === monthName);
  const totals={}; let grand=0;
  expenses.forEach(e=>{totals[e.category]=(totals[e.category]||0)+Number(e.amount);grand+=Number(e.amount);});

  const travel = totals['Hanging out']||0;
  document.getElementById('statRow').innerHTML = `
    <div class="stat"><div class="stat-label">Total</div><div class="stat-value accent">${fmt(grand)}</div><div class="stat-sub">${monthName}</div></div>
    <div class="stat"><div class="stat-label">Without travel</div><div class="stat-value">${fmt(grand-travel)}</div><div class="stat-sub">excl. hanging out</div></div>
    <div class="stat"><div class="stat-label">Entries</div><div class="stat-value green">${expenses.length}</div><div class="stat-sub">logged</div></div>
  `;

  const catTotals = CATS.map(c=>({...c,total:totals[c.key]||0})).filter(c=>c.total>0).sort((a,b)=>b.total-a.total);
  const max = Math.max(...catTotals.map(c=>c.total),1);
  document.getElementById('catList').innerHTML = catTotals.length
    ? catTotals.map(c=>`<div class="cat-row">
        <div class="cat-dot" style="background:${c.color}"></div>
        <div class="cat-name">${c.key}</div>
        <div class="cat-bar-wrap"><div class="cat-bar" style="width:${(c.total/max*100).toFixed(1)}%;background:${c.color}99"></div></div>
        <div class="cat-amount">${fmt(c.total)}</div>
      </div>`).join('')
    : '<div class="no-data">No expenses yet.</div>';

  if (dashChart) dashChart.destroy();
  if (catTotals.length) {
    const ctx = document.getElementById('dashChart').getContext('2d');
    dashChart = new Chart(ctx, {
      type:'doughnut',
      data:{ labels:catTotals.map(c=>c.key), datasets:[{data:catTotals.map(c=>parseFloat(c.total.toFixed(2))),backgroundColor:catTotals.map(c=>c.color+'cc'),borderColor:catTotals.map(c=>c.color),borderWidth:1,hoverOffset:6}] },
      options:{ responsive:true,maintainAspectRatio:false,cutout:'62%',
        plugins:{ legend:{position:'right',labels:{color:'#888580',font:{size:11,family:"'IBM Plex Mono'"},boxWidth:10,padding:12}}, tooltip:{callbacks:{label:ctx=>` ${ctx.label}: ${fmt(ctx.raw)}`}} } }
    });
  }

  const sorted = [...expenses].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  document.getElementById('entriesList').innerHTML = sorted.length
    ? sorted.map((e,i)=>`
      <div class="entry-row">
        <div class="entry-info">
          <div class="entry-desc">${escHtml(e.merchant)}</div>
          <div class="entry-meta">${e.date||''}</div>
        </div>
        <div class="entry-cat-pill">${e.category}</div>
        <div class="entry-amt">${fmt(e.amount)}</div>
        <div class="entry-actions">
          <button class="action-btn del" onclick="deleteCached(${all.indexOf(e)})" title="Delete">🗑</button>
        </div>
      </div>`).join('')
    : '<div class="no-data">No entries yet.</div>';
}

function deleteCached(globalIdx) {
  if (!confirm('Remove this entry from the view?\n\nNote: to permanently delete from Google Sheets, open the sheet and delete the row there.')) return;
  const all = JSON.parse(localStorage.getItem('amanda_dash_cache') || '[]');
  all.splice(globalIdx, 1);
  localStorage.setItem('amanda_dash_cache', JSON.stringify(all));
  const sel = document.getElementById('monthSelect');
  if (sel) renderMonthFromCache(sel.value);
}

async function init() {
  await loadConfig();
  addBotMessage("Hey Amanda 👋 Just tell me what you spent.<br><br>Try: <em>\"$11 Shake Shack\"</em> or <em>\"Uber $18\"</em>.<br>Tap <strong>📊 Dashboard</strong> — syncs with Google Sheets on all devices!");
}
init();
</script>
